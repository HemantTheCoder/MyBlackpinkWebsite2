<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Blackpink</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-logo">BLACKPINK</div>
    <div class="loading-sub">Initializing Blink OS</div>
    <div class="loading-bar"><div class="loading-fill"></div></div>
  </div>

  <div id="page-transition"></div>
  <canvas id="lightstick-canvas"></canvas>

  <header class="hero">
    <div class="hero-content">
      <div class="hud-eyebrow"><span class="dot"></span> Account Recovery</div>
      <h1>Reset Password</h1>
      <p style="font-size: 1.2rem; font-weight: 300; margin-top: 0.5rem; position:relative; z-index:1;">Choose a new password for your Blink account.</p>
    </div>
  </header>

  <main class="container">
    <nav class="btn-group">
      <a href="index.html" class="btn">Home</a>
      <a href="login.html" class="btn">Login</a>
    </nav>

    <div class="glass-card" style="max-width: 500px; margin: 0 auto;">
      <div id="reset-form-section">
        <h2 style="text-align: center; margin-bottom: 1.5rem;">Set a New Password</h2>
        <form id="reset-password-form" style="display: flex; flex-direction: column; gap: 1rem;">
          <input type="password" id="new-password" placeholder="New password" required minlength="6" style="width: 100%; padding: 1rem; border-radius: 10px; border: 1px solid var(--bp-pink); background: rgba(0,0,0,0.5); color: white; font-family: inherit;">
          <input type="password" id="confirm-password" placeholder="Confirm new password" required minlength="6" style="width: 100%; padding: 1rem; border-radius: 10px; border: 1px solid var(--bp-pink); background: rgba(0,0,0,0.5); color: white; font-family: inherit;">
          <button type="submit" class="btn btn-glow" style="margin-top: 1rem;">Update Password</button>
        </form>
        <p id="reset-status" class="text-center" style="margin-top: 1.5rem;"></p>
      </div>
      <div id="reset-invalid-section" style="display: none;">
        <h2 style="text-align: center; margin-bottom: 1rem;">Link Expired</h2>
        <p class="text-center">This password reset link is invalid or has expired. Please request a new one from the <a href="login.html" style="color: var(--bp-pink);">login page</a>.</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://ifubmlzruwvnjciplocy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmdWJtbHpydXd2bmpjaXBsb2N5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNDUzMzIsImV4cCI6MjEwMjgyMTMzMn0.ghNb4IB0FzBJqP4DAjo9LPaJ0wmXEqkx3gAq6kvN5Ak';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const formSection = document.getElementById('reset-form-section');
    const invalidSection = document.getElementById('reset-invalid-section');
    const statusEl = document.getElementById('reset-status');

    let recoveryReady = false;

    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') recoveryReady = true;
    });

    // Supabase puts the recovery tokens in the URL hash; give the client a moment to parse them.
    setTimeout(async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!recoveryReady && !session) {
        formSection.style.display = 'none';
        invalidSection.style.display = 'block';
      }
    }, 1200);

    document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;
      if (pw !== confirm) {
        statusEl.textContent = 'Passwords do not match.';
        statusEl.style.color = '#ff5555';
        return;
      }
      statusEl.textContent = 'Updating...';
      statusEl.style.color = '';
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) {
        statusEl.textContent = error.message || 'Could not update password.';
        statusEl.style.color = '#ff5555';
      } else {
        statusEl.textContent = 'Password updated! You can now log in.';
        statusEl.style.color = '#4caf50';
        await sb.auth.signOut();
        setTimeout(() => { window.location.href = 'login.html'; }, 1800);
      }
    });
  </script>
  <script src="script.js" defer></script>
</body>
</html>
